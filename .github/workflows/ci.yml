name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor and the current LTS.
        node: [18, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Packages resolve each other through dist/, so build precedes test.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test

      # dist/ is gitignored and must stay untracked; a dirty tree here means
      # build output was committed.
      - name: Verify build leaves tree clean
        run: git diff --exit-code
