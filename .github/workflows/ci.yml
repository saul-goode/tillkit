name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor and the current LTS.
        node: [18, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The adapter contract suite must run against a real database: the
      # guarantees it tests (unique indexes, concurrent-insert serialization)
      # live in the DB, not in adapter code. Without this, those tests skip.
      - name: Start PocketBase
        env:
          PB_VERSION: 0.22.47
        run: |
          curl -fsSL -o pb.zip \
            "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q pb.zip -d pb
          ./pb/pocketbase admin create test@test.com test123456 --dir=./pb_data
          ./pb/pocketbase serve --dir=./pb_data --http=127.0.0.1:8090 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8090/api/health

      # Packages resolve each other through dist/, so build precedes test.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm test
        env:
          POCKETBASE_TEST_URL: http://127.0.0.1:8090
          POCKETBASE_TEST_ADMIN_EMAIL: test@test.com
          POCKETBASE_TEST_ADMIN_PASSWORD: test123456

      # dist/ is gitignored and must stay untracked; a dirty tree here means
      # build output was committed.
      - name: Verify build leaves tree clean
        run: git diff --exit-code
